/* Layout: barra lateral fixa (vira abas no celular) + área de trabalho com cartões de resumo, gráfico de fluxo e tabelas operacionais */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunk:#E9EEEB; --ink:#15201B; --muted:#5B6862; --line:#D8E0DC;
  --accent:#1D6A51; --accent-ink:#FFFFFF; --accent-soft:#DDEEE6;
  --good:#1E7A4C; --good-soft:#DCF0E4; --warn:#9A6212; --warn-soft:#F7EAD2; --bad:#B42318; --bad-soft:#FBE3E0;
  --out:#7A4E9E; --out-soft:#EEE4F6;

  --r:10px; --logo:#6B7262;
}

.tema-btn{display:inline-flex;align-items:center;gap:8px;margin-top:10px;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink)}
.tema-btn:hover{border-color:var(--muted)}
.tema-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.btn.tema-m{display:none}
@media (max-width:760px){.btn.tema-m{display:inline-flex;flex:none;margin-left:auto}}
.temas{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tema{border:2px solid var(--line);border-radius:10px;padding:0;cursor:pointer;background:none;text-align:left;overflow:hidden;color:var(--ink)}
.tema[aria-pressed="true"]{border-color:var(--ink)}
.tema:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tema-prev{display:flex;height:64px}
.tema-prev .sb{width:30%;}
.tema-prev .ct{flex:1;padding:8px;display:flex;flex-direction:column;gap:5px}
.tema-prev .ln{height:6px;border-radius:3px}
.tema-prev .ac{height:12px;width:55%;border-radius:4px}
.tema-n{display:block;padding:7px 10px;font-size:13px;font-weight:600;border-top:1px solid var(--line)}
.tema-n small{display:block;font-weight:400;color:var(--muted);font-size:11px}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
a{color:var(--accent)}

/* shell */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;line-height:1.1}
.brand-n{display:block;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin-top:8px;color:var(--ink)}

.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--bad-soft);color:var(--bad);border-radius:20px;padding:1px 7px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted)}
.main{min-width:0;padding-block:24px 48px;padding-left:max(16px,2.2vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.2vw)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.015em;margin:0;line-height:1.1;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0;letter-spacing:-.005em}
.sub{color:var(--muted);margin:4px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;width:220px;max-width:100%}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-b{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lbl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:clamp(17px,1.5vw + 4px,22px);font-weight:500;letter-spacing:-.03em;line-height:1.2;overflow-wrap:anywhere}

/* ===== Alertas: mesmo código no sistema (quadro "Avisos de hoje") e no e-mail diário (Apps Script) ===== */
function montarAlertas(D,hoje){
  const cfg=D.config||{};
  const addD=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
  const brlA=c=>{const n=Math.round(c||0),neg=n<0,a=Math.abs(n),r=String(Math.floor(a/100)).replace(/\B(?=(\d{3})+(?!\d))/g,".");return (neg?"-":"")+"R$ "+r+","+String(a%100).padStart(2,"0")};
  const dt=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7):"";
  const dias=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
  const byId=(arr,id)=>(arr||[]).find(x=>x.id===id);
  const cli=id=>{const c=byId(D.clientes,id);return c?c.nome:""};
  const resp=id=>{const e=byId(D.equipe,id);return e?e.nome:""};
  const aberto=x=>x.status!=="pago"&&x.status!=="cancelado";
  const encargosA=x=>{const mp=Number(cfg.multaPct)||0,jm=Number(cfg.jurosMesPct)||0;const n=dias(x.vencimento,hoje);if(n<=0||(!mp&&!jm))return 0;
    return Math.round((x.valor||0)*mp/100)+Math.round((x.valor||0)*jm/100/30*n)};
  const soma=a=>a.reduce((s,x)=>s+(x.valor||0),0);
  const PRI={1:"Máxima",2:"Média",3:"Baixa"};
  const contrato=id=>byId(D.contratos,id);
  const descR=x=>{const k=x.contratoId&&contrato(x.contratoId);return [cli(x.clienteId)||(k&&cli(k.clienteId)),k?k.evento:x.descricao].filter(Boolean).join(" · ")};
  const G=[];const V={};const sec=(arr,o)=>{if(o.itens.length)arr.push(o)};
  const R=(D.receber||[]).filter(aberto),P=(D.pagar||[]).filter(aberto);
  const dow=new Date(hoje+"T12:00:00").getDay();const dia=Number(hoje.slice(8,10));

  // 1. recebimentos
  const rHoje=R.filter(x=>x.vencimento===hoje),rAtr=R.filter(x=>x.vencimento&&x.vencimento<hoje).sort((a,b)=>a.vencimento.localeCompare(b.vencimento));
  sec(G,{id:"receber",icone:"💰",titulo:"Recebimentos",nivel:rAtr.length?"alta":"media",rota:"receber",
    resumo:[rHoje.length&&`${rHoje.length} vence(m) hoje (${brlA(soma(rHoje))})`,rAtr.length&&`${rAtr.length} atrasado(s) (${brlA(soma(rAtr))})`].filter(Boolean).join(" · "),
    itens:[...rHoje.map(x=>({t:`Hoje · ${descR(x)}`,v:brlA(x.valor),s:x.numero?"boleto "+x.numero:""})),
           ...rAtr.map(x=>{const e=encargosA(x);return {t:`${dias(x.vencimento,hoje)} dia(s) de atraso · ${descR(x)}`,v:brlA(x.valor),s:(e?`atualizado ${brlA((x.valor||0)+e)}`:"")+(x.numero?(e?" · ":"")+"boleto "+x.numero:""),alerta:true}})]});
  // 2. pagamentos
  const pLim=addD(hoje,3);const pList=P.filter(x=>x.vencimento&&x.vencimento<=pLim).sort((a,b)=>(a.prioridade||3)-(b.prioridade||3)||a.vencimento.localeCompare(b.vencimento));
  sec(G,{id:"pagar",icone:"💸",titulo:"Contas a pagar (atrasadas e próximos 3 dias)",nivel:pList.some(x=>x.vencimento<hoje||x.prioridade===1)?"alta":"media",rota:"pagar",
    resumo:`${pList.length} conta(s) · ${brlA(soma(pList))}`+(pList.some(x=>x.prioridade===1)?` · ${pList.filter(x=>x.prioridade===1).length} de prioridade máxima`:""),

  // 3. eventos em risco: nos próximos 30 dias com parcela em aberto
  const ev=(D.contratos||[]).filter(c=>c.status!=="cancelado"&&c.dataEvento>=hoje&&c.dataEvento<=addD(hoje,30)).map(c=>({c,ab:R.filter(r=>r.contratoId===c.id)})).filter(o=>o.ab.length).sort((a,b)=>a.c.dataEvento.localeCompare(b.c.dataEvento));
  sec(G,{id:"eventos",icone:"⚠️",titulo:"Eventos nos próximos 30 dias sem quitação",nivel:"alta",rota:"contratos",resumo:`${ev.length} evento(s) · falta receber ${brlA(ev.reduce((s,o)=>s+soma(o.ab),0))}`,
    itens:ev.map(o=>({t:`${dt(o.c.dataEvento)} (em ${dias(hoje,o.c.dataEvento)} dia(s)) · ${o.c.evento} · ${cli(o.c.clienteId)}`,v:brlA(soma(o.ab)),s:o.ab.some(p=>p.vencimento<hoje)?"tem parcela atrasada":"parcela em aberto",alerta:dias(hoje,o.c.dataEvento)<=15}))});
  // 4. caixa projetado
  const saldoC=c=>{const d0=c.saldoData||"0000-00-00";let s=c.saldoInicial||0;
    for(const x of D.receber||[])if(x.status==="pago"&&x.contaId===c.id&&(x.pagoEm||"")>d0)s+=(x.valorPago!=null?x.valorPago:x.valor)||0;
    for(const x of D.pagar||[])if(x.status==="pago"&&x.contaId===c.id&&(x.pagoEm||"")>d0)s-=(x.valorPago!=null?x.valorPago:x.valor)||0;
    for(const t of D.transf||[]){if((t.data||"")<=d0)continue;if(t.de===c.id)s-=t.valor||0;if(t.para===c.id)s+=t.valor||0}return s};
  if((D.contas||[]).length){const t30=addD(hoje,30);const bancos=(D.contas||[]).filter(c=>!c.inativa).reduce((s,c)=>s+saldoC(c),0);
    const proj=bancos+soma(R.filter(x=>x.vencimento<=t30))-soma(P.filter(x=>x.vencimento<=t30));
    if(proj<0)G.push({id:"caixa",icone:"📉",titulo:"Caixa projetado negativo",nivel:"alta",rota:"painel",resumo:`Saldo previsto em 30 dias: ${brlA(proj)}`,
      itens:[{t:`Bancos hoje ${brlA(bancos)} + a receber ${brlA(soma(R.filter(x=>x.vencimento<=t30)))} − a pagar ${brlA(soma(P.filter(x=>x.vencimento<=t30)))}`,v:brlA(proj),alerta:true}]})}
  // 5. conciliação parada
  const lim7=addD(hoje,-7);const pc={};
  for(const e of D.extrato||[]){const cid=e.contaId||String(e.id||"").split("_")[0];const t=e.t||{};for(const k in t){const x=t[k];if((!x.st||x.st==="pendente")&&x.d&&x.d<lim7)pc[cid]=(pc[cid]||0)+1}}
  sec(G,{id:"conciliacao",icone:"🏦",titulo:"Conciliação pendente há mais de 7 dias",nivel:"media",rota:"conciliacao",resumo:`${Object.values(pc).reduce((a,b)=>a+b,0)} movimento(s) do banco`,
    itens:Object.keys(pc).map(cid=>({t:(byId(D.contas,cid)||{}).nome||"Banco",v:`${pc[cid]} movimento(s)`}))});
  // 6. pedidos de acesso
  const ped=(D.pedidos||[]).filter(p=>p.status==="pendente");
  sec(G,{id:"pedidos",icone:"👤",titulo:"Pedidos de acesso",nivel:"media",rota:"orcamentos",resumo:`${ped.length} aguardando aprovação`,itens:ped.map(p=>({t:`${p.nome||p.id} · ${p.id}`,s:p.funcao||""}))});
  // 6b. contratos aguardando assinatura da gestão
  const assP=(D.contratos||[]).filter(c=>c.status!=="cancelado"&&c.assinatura&&c.assinatura.status==="pendente").sort((a,b)=>(a.assinatura.pedidoEm||"").localeCompare(b.assinatura.pedidoEm||""));
  sec(G,{id:"assinar",icone:"✍️",titulo:"Contratos aguardando sua assinatura",nivel:"alta",rota:"contratos",resumo:`${assP.length} contrato(s) para assinar`,
    itens:assP.map(c=>({t:`${c.evento} · ${cli(c.clienteId)}${c.dataEvento?" · evento "+dt(c.dataEvento):""}`,s:`pedido por ${resp(c.responsavelId)||"comercial"} em ${dt((c.assinatura.pedidoEm||"").slice(0,10))}`,v:brlA(c.valorTotal),alerta:dias((c.assinatura.pedidoEm||hoje).slice(0,10),hoje)>=2}))});
  // 7. alterações sensíveis (últimas 24h)
  const desde=new Date(new Date(hoje+"T08:00:00").getTime()-864e5).toISOString();const nomeP=e=>{const u=(D.usuarios||[]).find(u=>u.id===e);return (u&&u.nome)||e||"alguém"};
  const sens=(D.log||[]).filter(l=>(l.em||"")>=desde&&((l.acao==="excluiu"&&["contratos","receber","pagar","clientes"].includes(l.col))||(l.acao==="alterou"&&l.col==="contratos"&&(l.mudancas||[]).some(m=>m.c==="valor total"))||(l.acao==="alterou"&&l.col==="config"&&(l.mudancas||[]).some(m=>m.c==="fechado até"))));
  const COLN={contratos:"contrato",receber:"parcela",pagar:"conta a pagar",clientes:"cliente",config:"fechamento"};
  sec(G,{id:"sensivel",icone:"🔐",titulo:"Alterações sensíveis nas últimas 24h",nivel:"media",rota:"controle",resumo:`${sens.length} alteração(ões) para conferir`,
    itens:sens.map(l=>({t:`${nomeP(l.por)} ${l.acao} ${COLN[l.col]||l.col} · ${l.resumo||""}`,s:(l.mudancas||[]).filter(m=>m.c==="valor total"||m.c==="fechado até").map(m=>`${m.c}: ${m.de} → ${m.para}`).join("")}))});
  // 8. mês sem fechar
  const mesAnt=addD(hoje.slice(0,7)+"-01",-1).slice(0,7);
  if(dia>=10&&(cfg.fechadoAte||"")<mesAnt)G.push({id:"fechamento",icone:"📆",titulo:"Mês anterior ainda aberto",nivel:"media",rota:"controle",resumo:`Feche ${mesAnt.slice(5,7)}/${mesAnt.slice(0,4)} em Controle → Fechamento do mês`,itens:[{t:"Conferir conciliação e pendências, depois fechar o mês"}]});
  // 9. segunda-feira: semana
  if(dow===1){const fim=addD(hoje,6);const evs=(D.contratos||[]).filter(c=>c.status!=="cancelado"&&c.dataEvento>=hoje&&c.dataEvento<=fim);
    const ent=R.filter(x=>x.vencimento>=hoje&&x.vencimento<=fim),sai=P.filter(x=>x.vencimento>=hoje&&x.vencimento<=fim);
    G.push({id:"semana",icone:"📊",titulo:"Sua semana",nivel:"info",rota:"painel",resumo:`${evs.length} evento(s) · entradas previstas ${brlA(soma(ent))} · saídas previstas ${brlA(soma(sai))}`,
      itens:evs.sort((a,b)=>a.dataEvento.localeCompare(b.dataEvento)).map(c=>({t:`${dt(c.dataEvento)} · ${c.evento} · ${cli(c.clienteId)}`,s:c.convidados?c.convidados+" convidados":""}))})}
  // 10. início do mês: comissões e resultado do mês anterior
  if(dia===1||(dia===2&&dow===1)){const mA=mesAnt;const pagos=a=>a.filter(x=>x.status==="pago"&&(x.pagoEm||"").startsWith(mA)).reduce((s,x)=>s+((x.valorPago!=null?x.valorPago:x.valor)||0),0);
    const ent=pagos(D.receber||[]),sai=pagos(D.pagar||[]);const base=cfg.comissaoBase||"fechado";const com={};
    const pct=eid=>{const e=byId(D.equipe,eid);return e&&e.comissaoPct!=null&&e.comissaoPct!==""?Number(e.comissaoPct):Number(cfg.comissaoPct)||0};
    if(base==="recebido"){for(const p of D.receber||[])if(p.status==="pago"&&(p.pagoEm||"").startsWith(mA)&&p.contratoId){const c=contrato(p.contratoId);if(c&&c.responsavelId)com[c.responsavelId]=(com[c.responsavelId]||0)+((p.valorPago!=null?p.valorPago:p.valor)||0)}}
    else for(const c of D.contratos||[])if(c.status!=="cancelado"&&(c.dataAssinatura||"").startsWith(mA)&&c.responsavelId)com[c.responsavelId]=(com[c.responsavelId]||0)+(c.valorTotal||0);
    G.push({id:"mes",icone:"🗓️",titulo:`Fechamento de ${mA.slice(5,7)}/${mA.slice(0,4)}`,nivel:"info",rota:"resultados",resumo:`Recebido ${brlA(ent)} · pago ${brlA(sai)} · resultado ${brlA(ent-sai)}`,
      itens:Object.keys(com).map(eid=>({t:`Comissão · ${resp(eid)} (${String(pct(eid)).replace(".",",")}%)`,v:brlA(Math.round(com[eid]*pct(eid)/100))}))})}

  // ---------- por vendedor ----------
  const donoDe=x=>x.responsavelId||(String(x._o||"").startsWith("eq-")?String(x._o).slice(3):"");
  for(const e of D.equipe||[]){if(e.ativo===false)continue;const L=[];
    const orc=(D.orcamentos||[]).filter(o=>donoDe(o)===e.id&&["aberto","enviado","negociacao"].includes(o.status));
    const ret=orc.filter(o=>o.proximoContato&&o.proximoContato<=hoje);
    sec(L,{id:"retornos",icone:"📞",titulo:"Retornos de orçamento para hoje",nivel:"alta",rota:"orcamentos",resumo:`${ret.length} cliente(s) para contatar`,
      itens:ret.map(o=>({t:`${o.numero||""} · ${o.contatoNome||cli(o.clienteId)||""}${o.evento?" · "+o.evento:""}`,v:o.valor?brlA(o.valor):"",s:[o.contatoTelefone||(cli(o.clienteId)&&(byId(D.clientes,o.clienteId)||{}).telefone),o.proximoContato<hoje?"retorno atrasado desde "+dt(o.proximoContato):""].filter(Boolean).join(" · "),alerta:o.proximoContato<hoje}))});
    const par=orc.filter(o=>o.status==="enviado"&&!(o.proximoContato&&o.proximoContato>=hoje)&&((o.atualizadoEm||o.criadoEm||"").slice(0,10)||o.data||hoje)<=addD(hoje,-7)&&!ret.includes(o));
    sec(L,{id:"parados",icone:"💤",titulo:"Orçamentos parados há 7 dias ou mais",nivel:"media",rota:"orcamentos",resumo:`${par.length} sem novidade`,
      itens:par.map(o=>({t:`${o.numero||""} · ${o.contatoNome||cli(o.clienteId)||""}${o.evento?" · "+o.evento:""}`,v:o.valor?brlA(o.valor):""}))});
    const evv=(D.contratos||[]).filter(c=>donoDe(c)===e.id&&c.status!=="cancelado"&&c.dataEvento>=hoje&&c.dataEvento<=addD(hoje,15)).map(c=>({c,ab:R.filter(r=>r.contratoId===c.id)})).filter(o=>o.ab.length);
    sec(L,{id:"eventosv",icone:"📅",titulo:"Eventos dos seus clientes com parcela em aberto",nivel:"alta",rota:"contratos",resumo:`${evv.length} evento(s) nos próximos 15 dias`,
      itens:evv.map(o=>({t:`${dt(o.c.dataEvento)} · ${o.c.evento} · ${cli(o.c.clienteId)}`,v:brlA(soma(o.ab)),alerta:true}))});
    const ass=(D.contratos||[]).filter(c=>donoDe(c)===e.id&&c.assinatura&&c.assinatura.status==="assinado"&&(c.assinatura.assinadoEm||"").slice(0,10)>=addD(hoje,-3));
    sec(L,{id:"assinados",icone:"✅",titulo:"Contratos assinados pela gestão",nivel:"info",rota:"contratos",resumo:`${ass.length} pronto(s) para enviar ao cliente`,
      itens:ass.map(c=>({t:`${c.evento} · ${cli(c.clienteId)}`,s:"assinado em "+dt((c.assinatura.assinadoEm||"").slice(0,10))}))});
    const espera=(D.contratos||[]).filter(c=>donoDe(c)===e.id&&c.status!=="cancelado"&&c.assinatura&&c.assinatura.status==="pendente");
    sec(L,{id:"esperando",icone:"⏳",titulo:"Aguardando assinatura da gestão",nivel:"info",rota:"contratos",resumo:`${espera.length} contrato(s)`,
      itens:espera.map(c=>({t:`${c.evento} · ${cli(c.clienteId)}`,s:"pedido em "+dt((c.assinatura.pedidoEm||"").slice(0,10))}))});
    if(L.length)V[e.id]=L;
  }
  return {gestao:G,vendedores:V};

function vPainel(){

  const abertoR=rec.filter(x=>x.status!=="pago"),abertoP=pag.filter(x=>x.status!=="pago");

  const r30=abertoR.filter(x=>x.vencimento<=t30&&x.vencimento>=t),p30=abertoP.filter(x=>x.vencimento<=t30&&x.vencimento>=t);
  const atr=abertoR.filter(x=>x.vencimento<t),atrP=abertoP.filter(x=>x.vencimento<t);

  const recMes=rec.filter(x=>x.status==="pago"&&(x.pagoEm||"").slice(0,7)===mk).reduce((s,x)=>s+(x.valorPago??x.valor),0);
  const pagMes=pag.filter(x=>x.status==="pago"&&(x.pagoEm||"").slice(0,7)===mk).reduce((s,x)=>s+(x.valorPago??x.valor),0);

    .filter(x=>x.vencimento<=addDays(t,15)).sort((a,b)=>a.vencimento.localeCompare(b.vencimento)).slice(0,12);

  const evts=S.contratos.filter(c=>c.status!=="cancelado"&&c.dataEvento>=t).sort((a,b)=>a.dataEvento.localeCompare(b.dataEvento)).slice(0,6);

  const proxRows=prox.length?`<div class="tbl-wrap"><table><thead><tr><th>Vencimento</th><th>Descrição</th><th class="r">Valor</th><th>Situação</th></tr></thead><tbody>${prox.map(x=>{const st=status(x);return `<tr class="${rowCls(st)}"><td class="num">${fmtD(x.vencimento)}</td><td><span class="tag ${x._t}">${x._t==="in"?"Receber":"Pagar"}</span> <span class="t">${esc(x._t==="in"?(clienteNome(x.clienteId)||x.descricao):x.fornecedor)}</span>${x._t==="out"?" "+prioTag(x.prioridade):""}<div class="s">${esc(x.descricao||"")}${x.numero?" · boleto "+esc(x.numero):""}</div></td><td class="r num">${brl(x.valor)}</td><td>${pill(st)}</td></tr>`}).join("")}</tbody></table></div>`
   :`<div class="empty"><strong>Nada vencendo nos próximos 15 dias</strong>Os vencimentos de contratos e contas a pagar aparecem aqui.</div>`;

  const evtRows=evts.length?evts.map(c=>{

   :`<div class="empty"><strong>Nenhum evento futuro</strong>Cadastre um contrato para acompanhar entrada e quitação de cada evento.</div>`;

  return `<div class="head"><div><h1>Painel</h1><p class="sub">${new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p></div>
  <div class="actions">${W()?`<button class="btn primary" data-a="novo-contrato">+ Novo contrato</button><button class="btn" data-a="nova-despesa">+ Conta a pagar</button>`:""}</div></div>
  <div class="kpis">
   <div class="kpi"><span class="lbl">A receber · 30 dias</span><span class="val">${brl(sum(r30))}</span><span class="det">${r30.length} parcela(s) em aberto</span></div>

   <div class="kpi ${saldo<0?"bad":"good"}"><span class="lbl">Saldo projetado · 30 dias</span><span class="val">${brl(saldo)}</span><span class="det">Bancos + entradas − saídas, com atrasados</span></div>
   <div class="kpi ${atr.length?"bad":""}"><span class="lbl">Recebimentos atrasados</span><span class="val">${brl(sum(atr))}</span><span class="det">${atr.length} parcela(s) de clientes</span></div>

  <div class="grid2">
   <section class="panel"><div class="panel-h"><h2>Próximos vencimentos</h2><span class="s muted" style="font-size:12px">atrasados + 15 dias</span></div>${proxRows}</section>
   <section class="panel"><div class="panel-h"><h2>Próximos eventos</h2><a href="#contratos" class="s" style="font-size:13px">Ver contratos</a></div>${evtRows}</section>
  </div>`;
}

function drawChart(){
  const el=document.getElementById("chart");if(!el)return;
  const now=new Date();const months=[];
  for(let i=-2;i<=5;i++){const d=new Date(now.getFullYear(),now.getMonth()+i,1);months.push({k:d.getFullYear()+"-"+pad(d.getMonth()+1),l:MES[d.getMonth()]+(d.getMonth()===0||i===-2?" "+String(d.getFullYear()).slice(2):""),inR:0,inP:0,outR:0,outP:0})}
  const idx=Object.fromEntries(months.map((m,i)=>[m.k,i]));
  for(const x of S.receber){if(x.status==="cancelado")continue;const e=eff(x);const i=idx[(e.d||"").slice(0,7)];if(i==null)continue;e.real?months[i].inR+=e.v:months[i].inP+=e.v}
  for(const x of S.pagar){if(x.status==="cancelado")continue;const e=eff(x);const i=idx[(e.d||"").slice(0,7)];if(i==null)continue;e.real?months[i].outR+=e.v:months[i].outP+=e.v}
  const max=Math.max(1,...months.map(m=>Math.max(m.inR+m.inP,m.outR+m.outP)));
  const nice=v=>{const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p};
  const top=nice(max);
  const Wd=760,H=250,L=64,R=8,T=12,B=46,cw=(Wd-L-R)/months.length,bw=Math.min(22,cw*0.3);
  const y=v=>T+(H-T-B)*(1-v/top);
  let g="";
  for(let i=0;i<=4;i++){const v=top*i/4;g+=`<line x1="${L}" x2="${Wd-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v>=100000?(v/100000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":Math.round(v/100)}</text>`}

  months.forEach((m,i)=>{
    const cx=L+cw*i+cw/2,x1=cx-bw-2,x2=cx+2;
    const bar=(x,real,prev,col)=>{let s="";const yr=y(real),yp=y(real+prev);
      if(real>0)s+=`<rect x="${x}" y="${yr}" width="${bw}" height="${y(0)-yr}" fill="${col}" rx="2"><title>${brl(real)}</title></rect>`;
      if(prev>0)s+=`<rect x="${x}" y="${yp}" width="${bw}" height="${yr-yp}" fill="${col}" opacity=".35" rx="2"><title>${brl(prev)} previsto</title></rect>`;return s};
    g+=bar(x1,m.inR,m.inP,"var(--accent)")+bar(x2,m.outR,m.outP,"var(--out)");
    const net=m.inR+m.inP-m.outR-m.outP;
    g+=`<text x="${cx}" y="${H-B+18}" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="${m.k===cur?700:400}" font-family="IBM Plex Sans, sans-serif">${m.l}</text>`;
    if(m.inR+m.inP+m.outR+m.outP>0)g+=`<text x="${cx}" y="${H-B+34}" text-anchor="middle" font-size="10.5" fill="${net<0?"var(--bad)":"var(--good)"}" font-family="IBM Plex Mono, monospace">${net<0?"−":"+"}${Math.abs(net)>=100000?(Math.abs(net)/100000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":Math.round(Math.abs(net)/100)}</text>`;
  });
  el.innerHTML=`<div class="tbl-wrap"><svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Entradas e saídas por mês" style="min-width:520px">${g}<line x1="${L}" x2="${Wd-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/></svg></div><div class="s muted" style="font-size:12px;margin-top:6px">Valores em reais. Abaixo de cada mês: entradas − saídas. Pagos contam na data do pagamento; em aberto, na data de vencimento, e os já atrasados entram no mês atual.</div>`;

/* ---------- Pagar ---------- */
/* ---------- Importar DDA (boletos emitidos contra o CNPJ) ---------- */
const reData=/^(\d{2})\/(\d{2})\/(\d{4})$/,reValor=/^-?(?:R\$\s*)?\d{1,3}(?:\.\d{3})*,\d{2}$|^-?(?:R\$\s*)?\d+,\d{2}$/;
const isoDe=d=>{const m=reData.exec(d.trim());return m?`${m[3]}-${m[2]}-${m[1]}`:""};
function linhaDDA(cel){ // cel: textos da linha na ordem
  cel=cel.map(c=>String(c||"").trim()).filter(Boolean);
  const iv=cel.findIndex(c=>reData.test(c));if(iv<0)return null;
  const im=cel.findIndex((c,i)=>i>iv&&reValor.test(c));if(im<0)return null;
  const antes=cel.slice(0,iv);if(!antes.length)return null;
  let benef=antes[0],doc=antes.slice(1).join(" ");
  if(antes.length===1){const m=/^(.*?)\s{2,}(\S.*)$/.exec(antes[0]);if(m){benef=m[1];doc=m[2]}}
  if(/^(benefici|cedente|vencimento|total)/i.test(benef))return null;
  return {benef:benef.trim(),doc:doc.trim(),venc:isoDe(cel[iv]),valor:parseBRL(cel[im].replace(/R\$\s*/,""))};
}
function lerDDABlocos(linhas){
  const out=[];let cur=null;const dig=t=>String(t||"").replace(/\D/g,"");
  for(const ln of linhas){const t=ln.replace(/\s+/g," ").trim();if(!t)continue;
    let pm=/^Pagador:.*CNPJ\s*([\d./-]{11,20})/i.exec(t);if(pm&&cur){cur.pagador=dig(pm[1]);continue}
    let m=/^(?!Pagador)(.+?)\s+CNPJ\s*([\d./-]{11,20})$/i.exec(t);
    if(m){cur={benef:m[1].trim(),cnpj:dig(m[2])};continue}
    m=/^(\S+)\s+(\d{4}-\d{2}-\d{2})\s+(\d{4}-\d{2}-\d{2})\s+(\S+)\s+R\$\s*([\d.]+,\d{2})/.exec(t);
    if(m&&cur){cur.situacao=m[1];cur.venc=m[3];cur.valor=parseBRL(m[5]);cur.pago=/pag|liquid|baixad/i.test(m[1])||(m[4]!=="-"&&/\d/.test(m[4]));out.push(cur);continue}
    m=/^(\d{6,})\s+([\d.\s]{40,})$/.exec(t);
    if(m&&cur&&out[out.length-1]===cur){cur.doc=m[1];cur.linha=m[2].trim()}
  }

async function lerDDAArquivo(file){

    for(let n=1;n<=pdf.numPages;n++){const pg=await pdf.getPage(n);const tc=await pg.getTextContent();
      const L={};for(const it of tc.items){const t=(it.str||"").trim();if(!t)continue;const y=Math.round(it.transform[5]/3);(L[y]=L[y]||[]).push({x:it.transform[4],t})}
      pags.push(L)}
    const todas=[];for(const L of pags)for(const y of Object.keys(L).map(Number).sort((a,b)=>b-a))todas.push(L[y].sort((a,b)=>a.x-b.x).map(i=>i.t).join(" "));

        let cel;
        if(col&&col.doc!=null&&col.venc!=null){const b=[],d=[],r=[];for(const i of it){if(i.x<col.doc-4)b.push(i.t);else if(i.x<col.venc-4)d.push(i.t);else r.push(i.t)}cel=[b.join(" "),d.join(" "),...r]}

function lerDDATexto(txt){

    if(!cel){const m=/^(.+?)\s+(\S+(?:\s\S+)?)\s+(\d{2}\/\d{2}\/\d{4})\s+(?:R\$\s*)?(-?[\d.]+,\d{2})\s*$/.exec(ln.trim());cel=m?[m[1],m[2],m[3],m[4]]:[]}

function lerLote(txt){
  const ehValor=c=>{const s=String(c).replace(/R\$|\s/g,"");if(!/^-?[\d.,]+$/.test(s)||!/\d/.test(s))return false;
    const dig=s.replace(/\D/g,"");if(!/[.,]\d{1,2}$/.test(s)&&dig.length>6)return false;if(/^\d{2}[./]\d{2}([./]\d{2,4})?$/.test(s))return false;const v=parseBRL(s);return !isNaN(v)&&v>0};

  const ehData=c=>/^\d{1,2}\/\d{1,2}(\/\d{2,4})?$/.test(c.trim());
  const isoData=c=>{const [d,m,y]=c.trim().split("/");const a=!y?todayISO().slice(0,4):y.length===2?"20"+y:y;return a+"-"+pad(m)+"-"+pad(d)};

    if(cel.filter(Boolean).length===1){const t=cel.find(Boolean);const m=t.match(/^(.*?[A-Za-zÀ-ú].*?)\s+(R\$\s*)?([\d.]+(,\d{1,2})?)$/);if(m)cel=[m[1].replace(/[-–:]+$/,"").trim(),m[3]]}

    if(iN>=0&&iV>=0){hi=k;cN=iN;cV=iV;cMax=r.reduce((m,c,i)=>c?i:m,0);cP=n.findIndex(c=>/pix|^chave/.test(c));cD=n.findIndex(c=>/^(data|pagar em|vencimento|pagamento)$/.test(c))}});
  const out=[];let ign=0;

  });

const dlg=document.getElementById("dlg");
function historico(x){
  if(!x||!x.id)return "";
  const quemF=id=>id?(S.names[id]||(id===S.me?"você":"alguém da equipe")):"";
  const dt=iso=>iso?new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"";
  const partes=[];
  if(x.criadoEm)partes.push(`Criado${x.criadoPor?" por "+esc(quemF(x.criadoPor)):""} em ${dt(x.criadoEm)}`);
  if(x.atualizadoEm)partes.push(`última alteração${x.atualizadoPor?" por "+esc(quemF(x.atualizadoPor)):""} em ${dt(x.atualizadoEm)}`);
  if(x.status==="pago"&&x.pagoPor)partes.push(`baixa por ${esc(quemF(x.pagoPor))}`);
  return partes.length?`<p class="hist">${partes.join(" · ")}</p>`:"";
}
function openDlg(title,fields,{submit="Salvar",onSubmit,extra="",danger=null,onOpen,registro=null}={}){

  dlg.innerHTML=`<form id="dform" novalidate><div class="dlg-h"><h2>${title}</h2></div><div class="dlg-b">${fields}${historico(registro)}<div class="err" id="derr" hidden></div></div>

  const f=dlg.querySelector("#dform");
  dlg.querySelector("#dcancel").onclick=()=>dlg.close();
  if(danger)dlg.querySelector("#ddanger").onclick=danger.fn;
  f.onsubmit=async ev=>{ev.preventDefault();const b=dlg.querySelector("#dsubmit");if(b)b.disabled=true;
    try{const r=await onSubmit(new FormData(f),f);if(r!==false)dlg.close()}
    catch(e){showErr(e&&e.message?e.message:String(e))}

async function write(fn){

    if(e&&e.code==="mes-fechado")throw new Error(e.message);
    if(e&&e.code==="permission-denied"&&S.dbState==="on")throw new Error("Você não tem permissão para registrar isso. Fale com o financeiro.");
    if(e&&e.code==="resource-exhausted")throw new Error("O banco de dados atingiu o limite de registros. Exporte e arquive itens antigos.");
    throw new Error("Não foi possível salvar ("+(e&&e.code||"erro")+"). Tente de novo.");
  }
}

      const entAberta=ativos.find(p=>p.tipo==="entrada"&&p.status!=="pago");
      const outrosAbertos=ativos.filter(p=>p.status!=="pago"&&p.tipo!=="entrada"&&p.tipo!=="quitacao").reduce((a,p)=>a+(p.valor||0),0);
      const ve=novo||entAberta?Math.max(0,Math.round(o.valorTotal*o.pctEntrada/100)-(novo?0:ativos.filter(p=>p.tipo==="entrada"&&p.status==="pago").reduce((a,p)=>a+((p.valorPago??p.valor)||0),0))):0;
      const vq=novo?o.valorTotal-ve:o.valorTotal-jaPago-(entAberta?ve:0)-outrosAbertos;

            const novoV=p.tipo==="entrada"?ve:p.tipo==="quitacao"?vq:p.valor;

          }
          if(o.status==="cancelado"&&c.status!=="cancelado"){
            const recebido=ps.filter(p=>p.status==="pago").reduce((a,p)=>a+((p.valorPago??p.valor)||0),0);
            const dev=fd.has("devolver")?Math.max(0,parseBRL(fd.get("devolver"))||0):0;
            const canc={em:todayISO(),motivo:String(fd.get("motivoCanc")||"").trim(),recebido,devolvido:Math.min(dev,recebido),retido:recebido-Math.min(dev,recebido),por:S.me||null};
            await alvo("contratos",c).set({...strip(c),...o,cancelamento:canc,...stamp()});

          }

            const ob=c.orcamentoId&&byId(S.orcamentos,c.orcamentoId);if(ob)await moverDoc("orcamentos",ob,novoDono)}
        }
      });
      toast(novo?`Contrato salvo · parcelas geradas para ${cli?cli.nome:"o cliente"}`:"Contrato atualizado");
    }});

/* multa e juros de parcelas atrasadas */
function encargos(x){
  if(!x||status(x)!=="vencido")return null;
  const mp=Number(S.config.multaPct)||0,jm=Number(S.config.jurosMesPct)||0;if(!mp&&!jm)return null;
  const dias=Math.max(0,Math.round((new Date(todayISO()+"T12:00")-new Date(x.vencimento+"T12:00"))/864e5));if(!dias)return null;
  const v=x.valor||0,multa=Math.round(v*mp/100),juros=Math.round(v*jm/100/30*dias);
  return {dias,multa,juros,total:v+multa+juros,mp,jm};
}

/* ---------- Bancos e formas de pagamento ---------- */
const FORMAS_REC=["Boleto","PIX","TED/Transferência","Maquininha (Stone)","Cartão","Dinheiro","Cheque"];
const FORMAS_PAG=["DDA","Boleto","PIX","TED/Transferência","Débito automático","Cartão","Dinheiro","Cheque"];
function contasOrd(todas){return S.contas.filter(c=>todas||c.ativo!==false).sort((a,b)=>(a.ordem??99)-(b.ordem??99)||a.nome.localeCompare(b.nome,"pt-BR"))}
function contaNome(id){const c=byId(S.contas,id);return c?c.nome:""}
function contaTag(id){const c=byId(S.contas,id);return c?`<span class="bank" style="--bc:${esc(c.cor||"var(--muted)")}">${esc(c.nome)}</span>`:""}
function metaPg(x){const parts=[contaTag(x.contaId),x.forma?`<span class="forma">${esc(x.forma)}</span>`:""].filter(Boolean);return parts.length?`<div class="pg">${parts.join("")}</div>`:""}
const CONTA_SEL=(name,label,val,{full=false,vazio="—"}={})=>!ADMIN()?"":SEL(name,label,[["",vazio],...contasOrd().map(c=>[c.id,c.nome])],val||"",{full});
const FORMA_SEL=(name,label,val,col,{full=false}={})=>SEL(name,label,[["","—"],...(col==="receber"?FORMAS_REC:FORMAS_PAG).map(f=>[f,f])],val||"",{full});
function inferForma(memo,v){
  const m=norm(memo);
  if(/stone/.test(m))return v>0?"Maquininha (Stone)":"PIX";
  if(/\bpix\b/.test(m))return "PIX";
  if(/ted|doc|transf/.test(m))return "TED/Transferência";
  if(/deb\.?\s*aut|debito automatico|deb automatico/.test(m))return "Débito automático";
  if(/cartao|cartão|visa|master|elo\b/.test(m))return "Cartão";
  if(/cobranca|boleto|pagto eletron|titulo|dda/.test(m))return v>0?"Boleto":"Boleto";
  if(/saque|dinheiro|deposito/.test(m))return "Dinheiro";
  return "";
}
/* saldo do sistema: saldo inicial (data de corte) + tudo que foi pago/recebido/transferido nessa conta depois da data */
function saldoConta(c){
  const d0=c.saldoData||"0000-00-00";let s=c.saldoInicial||0;
  for(const x of S.receber)if(x.status==="pago"&&x.contaId===c.id&&(x.pagoEm||"")>d0)s+=(x.valorPago??x.valor)||0;
  for(const x of S.pagar)if(x.status==="pago"&&x.contaId===c.id&&(x.pagoEm||"")>d0)s-=(x.valorPago??x.valor)||0;
  for(const t of S.transf){if((t.data||"")<=d0)continue;if(t.de===c.id)s-=t.valor||0;if(t.para===c.id)s+=t.valor||0}
  return s;
}
function semConta(){return S.receber.filter(x=>x.status==="pago"&&!x.contaId).length+S.pagar.filter(x=>x.status==="pago"&&!x.contaId).length}
function bancosResumo(){
  const cs=contasOrd();if(!cs.length)return "";

/* ---------- Conciliação bancária ---------- */
function ofxAmount(s){s=String(s||"").trim();if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const v=Number(s);return isFinite(v)?Math.round(v*100):NaN}
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)}
function parseOFX(text){
  const tag=(blk,n)=>{const m=new RegExp("<"+n+">([^<\\r\\n]*)","i").exec(blk);return m?m[1].trim():""};
  const conta=[tag(text,"BANKID"),tag(text,"BRANCHID"),tag(text,"ACCTID")].filter(Boolean).join("-");
  const saldoRaw=/<LEDGERBAL>[\s\S]*?<BALAMT>([^<\r\n]*)/i.exec(text);
  const out=[];const re=/<STMTTRN>([\s\S]*?)(?=<\/STMTTRN>|<STMTTRN>|<\/BANKTRANLIST>)/gi;let m;
  while((m=re.exec(text))){
    const b=m[1];const dt=tag(b,"DTPOSTED");const v=ofxAmount(tag(b,"TRNAMT"));
    if(!/^\d{8}/.test(dt)||isNaN(v)||v===0)continue;
    const d=dt.slice(0,4)+"-"+dt.slice(4,6)+"-"+dt.slice(6,8);
    const memo=(tag(b,"MEMO")||tag(b,"NAME")).replace(/\s+/g," ").trim();
    const num=tag(b,"CHECKNUM"),fitid=tag(b,"FITID");
    const k="t"+dt.slice(0,8)+"_"+(num?num.replace(/[^A-Za-z0-9]/g,""):hashStr(fitid+memo))+"_"+Math.abs(v);
    out.push({k,d,v,memo,num,fitid});
  }
  const org=tag(text,"ORG");
  return {conta,org,bankid:tag(text,"BANKID"),saldo:saldoRaw?ofxAmount(saldoRaw[1]):null,txs:out};
}
function payee(memo){
  let m=/(?:DES|REM)\s*[:.]\s*(.+?)(?:\s+\d{2}\/\d{2})?\s*$/i.exec(memo||"");if(m)return m[1].trim();
  m=/REMET\.\s*(.+)$/i.exec(memo||"");if(m)return m[1].trim();
  return (memo||"").trim();
}
const dayN=iso=>{const [y,m,d]=iso.split("-").map(Number);return Date.UTC(y,m-1,d)/864e5};
let _txCache=null,_txSrc=null;
function allTx(){
  if(_txSrc===S.extrato&&_txCache)return _txCache;
  const out=[];for(const m of S.extrato){const t=m.t||{};for(const k in t)out.push({...t[k],k,mes:m.id,uid:m.id+"~"+k,contaDoc:m.contaId||""})}
  _txSrc=S.extrato;_txCache=out.sort((a,b)=>a.d.localeCompare(b.d)||a.k.localeCompare(b.k));return _txCache;
}
function nOid(s){const p=String(s||"").split("-");return p.length>1?p[0].replace(/^0+/,"")+"-"+p[p.length-1]:String(s||"")}
function txConta(t){if(t.contaId)return t.contaId;if(t.contaDoc)return t.contaDoc;const o=nOid(t.conta);const c=t.conta&&S.contas.find(c=>c.ofxId&&nOid(c.ofxId)===o);return c?c.id:""}
function txByUid(u){return allTx().find(t=>t.uid===u)}
function tokens(s){return norm(s).split(/[^a-z0-9]+/).filter(w=>w.length>=3&&!["ltda","eireli","the","dos","das","de","s.a"].includes(w))}
function itemNome(col,x){if(col==="transf")return `Transferência ${contaNome(x.de)} → ${contaNome(x.para)}`;return col==="receber"?(clienteNome(x.clienteId)||x.descricao):x.fornecedor}
const _tokCache=new Map();
function tokensC(s){let t=_tokCache.get(s);if(!t){t=tokens(s);if(_tokCache.size>5000)_tokCache.clear();_tokCache.set(s,t)}return t}
function candidatos(tx,usados,incluiUsados,lista){
  const col=tx.v>0?"receber":"pagar",amt=Math.abs(tx.v),mm=norm(tx.memo),tc=txConta(tx);
  const res=[];
  for(const x of (lista||S[col])){
    if(x.status==="cancelado")continue;
    const jaPago=x.status==="pago";
    if(jaPago&&x.extratoKey)continue;
    if(!incluiUsados&&usados.has(x.id))continue;
    const ref=jaPago?(x.pagoEm||x.vencimento):x.vencimento;if(!ref)continue;
    const dd=Math.abs(dayN(tx.d)-dayN(ref));
    const hits=tokensC(itemNome(col,x)).filter(w=>mm.includes(w)).length;
    const valOk=Math.abs((jaPago?(x.valorPago??x.valor):x.valor)-amt)<=1;
    const outraConta=x.contaId&&tc&&x.contaId!==tc;
    res.push({x,col,jaPago,dd,hits,valOk,score:(valOk?100:0)+hits*25-dd-(outraConta?60:0)});
  }
  for(const x of S.transf){
    const lado=tx.v<0?"de":"para";if(tc&&x[lado]!==tc)continue;
    if(tx.v<0?x.extratoDe:x.extratoPara)continue;
    if(!incluiUsados&&usados.has(x.id))continue;
    const dd=Math.abs(dayN(tx.d)-dayN(x.data||tx.d));const valOk=Math.abs((x.valor||0)-amt)<=1;
    res.push({x,col:"transf",jaPago:false,dd,hits:1,valOk,score:(valOk?100:0)+25-dd});
  }
  return res.sort((a,b)=>b.score-a.score);
}
let _sugCache=null,_sugKey=null;
function sugestoes(){
  const key=[S.extrato,S.receber,S.pagar,S.transf,S.contas];
  if(_sugKey&&_sugKey.every((v,i)=>v===key[i]))return _sugCache;
  const pares=[];
  const idx={receber:new Map(),pagar:new Map()};
  for(const col of ["receber","pagar"])for(const x of S[col]){if(x.status==="cancelado"||(x.status==="pago"&&x.extratoKey))continue;
    const v=x.status==="pago"?(x.valorPago??x.valor):x.valor;for(const d of [-1,0,1]){const k=(v||0)+d;const a=idx[col].get(k);if(a)a.push(x);else idx[col].set(k,[x])}}
  for(const tx of allTx()){
    if(tx.st&&tx.st!=="pendente")continue;
    const lista=idx[tx.v>0?"receber":"pagar"].get(Math.abs(tx.v))||[];
    for(const c of candidatos(tx,new Set(),false,lista))if(c.valOk&&c.dd<=45&&(c.hits>0||c.dd<=20)&&(c.col!=="transf"||c.dd<=5))pares.push({u:tx.uid,c});
  }
  pares.sort((a,b)=>b.c.score-a.c.score);
  const usados=new Set(),map={};
  for(const {u,c} of pares){if(map[u]||usados.has(c.x.id))continue;map[u]=c;usados.add(c.x.id)}
  _sugKey=key;_sugCache=map;return map;
}
const ST_TX={pendente:"Pendente",conciliado:"Conciliado",lancado:"Lançado",ignorado:"Ignorado"};

      <td style="min-width:220px"><div class="t">${esc(payee(t.memo))}</div><div class="s">${UI.xb?"":contaTag(txConta(t))+" "}${esc(t.memo)}</div>${refTxt(t)}</td>

async function importarOFX(file){
  if(!file)return;
  if(!/\.ofx$/i.test(file.name)){toast("Escolha um arquivo .OFX");return}
  let text=await file.text();
  if(text.includes(String.fromCharCode(0xFFFD))){try{text=new TextDecoder("windows-1252").decode(await file.arrayBuffer())}catch(e){}}
  const r=parseOFX(text);
  if(!r.txs.length){toast("Não encontrei lançamentos neste arquivo. Confira se é um extrato OFX.");return}
  const oid=normOfxId(r);
  let conta=S.contas.find(c=>c.ofxId&&nOid(c.ofxId)===nOid(oid));
  if(!conta){
    const nomeBanco=BANK_NAMES[String(r.bankid||"").replace(/^0+/,"")]||r.org||"";
    const sugId=(S.contas.find(c=>nomeBanco&&norm(c.nome).includes(norm(nomeBanco)))||{}).id||"";
    openDlg("De qual conta é este extrato?",`<p class="fld full" style="margin:0">Arquivo <b>${esc(file.name)}</b>${nomeBanco?` · banco ${esc(nomeBanco)}`:""} · conta ${esc(String(r.conta).split("-").pop())} · ${r.txs.length} lançamentos. Vou lembrar a escolha nas próximas importações.</p>`+
      CONTA_SEL("contaId","Conta bancária",sugId,{full:true,vazio:S.contas.length?"Escolha":"Cadastre a conta em Bancos primeiro"}),
      {submit:"Importar",onSubmit:async fd=>{const id=String(fd.get("contaId")||"");need(id,"Escolha a conta.");const c=byId(S.contas,id);
        await write(()=>db.collection("contas").doc(id).set({...strip(c),ofxId:oid,...stamp()}));
        setTimeout(()=>gravarExtrato(r,{...c,ofxId:oid},file.name),30)}});
    return;
  }
  await gravarExtrato(r,conta,file.name);
}
async function gravarExtrato(r,conta,arquivo){
  const ja=new Set(allTx().filter(t=>txConta(t)===conta.id||(!txConta(t)&&t.conta===r.conta)).map(t=>t.k));
  const por={};for(const t of r.txs)(por[t.d.slice(0,7)]=por[t.d.slice(0,7)]||[]).push(t);
  let novos=0,rep=0;
  toast("Importando extrato…");
  try{
    for(const mes in por){
      const ref=db.collection("extrato").doc(conta.id+"_"+mes);const snap=await ref.get();
      const ex=snap.exists?(snap.data().t||{}):{};const add={};
      for(const t of por[mes]){if(ex[t.k]||ja.has(t.k)){rep++;continue}add[t.k]={d:t.d,v:t.v,memo:t.memo,num:t.num,fitid:t.fitid,conta:r.conta,contaId:conta.id,st:"pendente"};novos++}
      if(!Object.keys(add).length)continue;
      if(snap.exists)await ref.set({t:add},{merge:true});else await ref.set({contaId:conta.id,mes,t:add});
    }
    const ult=r.txs.reduce((m,t)=>t.d>m?t.d:m,"");
    const fresh=byId(S.contas,conta.id)||conta;
    const upd={...strip(fresh),ofxId:conta.ofxId||fresh.ofxId,ultimoExtrato:{arquivo,importadoEm:new Date().toISOString(),ate:ult}};
    if(r.saldo!=null&&(!fresh.saldoBancoData||ult>=fresh.saldoBancoData)){upd.saldoBanco=r.saldo;upd.saldoBancoData=ult}
    if(r.saldo!=null&&!fresh.saldoData){upd.saldoInicial=r.saldo;upd.saldoData=ult}
    await db.collection("contas").doc(conta.id).set(upd);
    UI.xf="pendentes";UI.xm="";UI.xb=conta.id;
    toast(`${conta.nome}: ${novos} lançamento(s) novo(s)${rep?` · ${rep} já importado(s)`:""}`);
  }catch(e){
    if(e&&e.code==="invalid-argument"&&/size|large|exceeds/i.test(e.message||""))toast("O extrato deste mês ficou grande demais. Importe períodos menores.");
    else toast("Não foi possível importar ("+(e&&e.code||"erro")+")");
  }
}
/* operações em lote: tenta de novo em falhas passageiras e marca o extrato aos poucos,
   para que uma interrupção no meio nunca gere lançamento duplicado */
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function comRetry(fn){
  for(let i=0;;i++){
    try{return await fn()}catch(e){const c=e&&e.code;if(i>=5||!(c==="resource-exhausted"||c==="unavailable"||c==="deadline-exceeded"||c==="aborted"))throw e;await espera(800*(i+1)+Math.random()*400)}
  }
}
async function emLote(itens,fazer,rotulo){
  const pend=[];let feitos=0;
  const flush=async()=>{if(pend.length){const l=pend.splice(0);await comRetry(()=>setTxMany(l))}};
  try{
    for(const it of itens){const m=await fazer(it);if(m)pend.push(m);feitos++;
      if(pend.length>=20)await flush();
      if(itens.length>30&&feitos%25===0)toast(`${rotulo}: ${feitos} de ${itens.length}…`)}
    await flush();
  }catch(e){
    try{await flush()}catch(_){}
    const er=new Error(`Parou em ${feitos} de ${itens.length} (${e&&e.code||"erro"}). Os ${feitos} já feitos ficaram salvos e marcados; rode de novo só com os que sobraram.`);er.lote=true;throw er;
  }
  return feitos;
}

async function desfazerTx(tx){
  const ref=tx.ref,x=ref?byId(S[ref.col]||[],ref.id):null;
  const msg=tx.st==="lancado"?"Desfazer e <b>excluir</b> o lançamento criado a partir do extrato?":tx.st==="conciliado"?"Desfazer a conciliação? Se a baixa foi feita por aqui, o item volta para “em aberto”.":"Voltar este lançamento para pendente?";
  if(!await confirmBox(msg,"Desfazer"))return;
  await act(async()=>{
    if(x&&ref.col==="transf"){
      const lado=tx.v<0?"extratoDe":"extratoPara";const outro=tx.v<0?"extratoPara":"extratoDe";
      if(tx.st==="lancado"&&ref.criado&&!x[outro])await db.collection("transf").doc(x.id).delete();
      else{const {[lado]:_,...rest}=strip(x);await db.collection("transf").doc(x.id).set({...rest,...stamp()})}
    }
    else if(x&&tx.st==="lancado")await docRef(ref.col,x).delete();
    else if(x&&tx.st==="conciliado"){
      const {extratoKey,...rest}=strip(x);
      if(x.obsPagamento==="Baixa pela conciliação bancária"){const {pagoEm,valorPago,pagoPor,obsPagamento,...r2}=rest;await docRef(ref.col,x).set({...r2,status:"aberto",...stamp()})}
      else await docRef(ref.col,x).set({...rest,...stamp()});
    }
    await setTx(tx,{st:"pendente",ref:null,por:S.me||null,em:new Date().toISOString()});
  },"Desfeito");
}

async function reservar(tipo,qtd){

  let piso=0;for(const r of (tipo==="boleto"?S.receber:S.orcamentos)){const x=/^(\d+)\/(\d{4})$/.exec(r.numero||"");if(x&&Number(x[2])===ano)piso=Math.max(piso,Number(x[1]))}
  if(tipo==="boleto"&&S.config.boletoAno===ano&&S.config.boletoInicio)piso=Math.max(piso,S.config.boletoInicio-1);
  try{
    return await db.runTransaction(async t=>{
      const s=await t.get(ref);const d=s.exists?s.data():{};
      const base=Math.max(d.ano===ano?(d.n||0):0,piso);
      t.set(ref,{ano,n:base+qtd,em:new Date().toISOString()});

function dadosComissao(mes,base){
  const pctDe=eid=>{const e=byId(S.equipe,eid);const v=e&&e.comissaoPct!=null&&e.comissaoPct!==""?Number(e.comissaoPct):Number(S.config.comissaoPct)||0;return v};
  const G={};const add=(eid,item)=>{const k=eid||"";(G[k]=G[k]||{eid:k,itens:[],base:0}).itens.push(item);G[k].base+=item.base};
  if(base==="recebido"){
    for(const p of S.receber){if(p.status!=="pago"||!(p.pagoEm||"").startsWith(mes)||!p.contratoId)continue;const c=byId(S.contratos,p.contratoId);if(!c)continue;
      add(c.responsavelId,{data:p.pagoEm,desc:`${c.evento} · ${p.descricao||p.tipo||"parcela"}`,base:(p.valorPago??p.valor)||0})}
  }else{
    for(const c of S.contratos){if(c.status==="cancelado"||!(c.dataAssinatura||"").startsWith(mes))continue;
      add(c.responsavelId,{data:c.dataAssinatura,desc:`${c.evento} · ${clienteNome(c.clienteId)}`,base:c.valorTotal||0})}
  }
  return Object.values(G).map(g=>({...g,pct:g.eid?pctDe(g.eid):0,nome:g.eid?respNome(g.eid):"Sem responsável"})).map(g=>({...g,valor:Math.round(g.base*g.pct/100)})).sort((a,b)=>b.base-a.base);
}

/* ---------- DRE mensal ---------- */
const CATS_REC=["Eventos","Serviços extras / degustação","Rendimentos financeiros","Outras receitas"];
const CUSTO_DIRETO=["Alimentos","Bebidas","Equipe / freelancers"];
function catRec(x){if(x.contratoId)return "Eventos";return x.categoria||"Outras receitas"}
function linhaDRE(x,col){ // em qual linha do DRE o lançamento entra
  if(col==="receber")return "rec:"+catRec(x);
  if(x.categoria==="Devoluções")return "dev";
  if(x.categoria==="Impostos")return "imp";
  if(x.contratoId||CUSTO_DIRETO.includes(x.categoria))return "cus:"+(x.categoria||"Outros");
  return "des:"+(x.categoria||"Outros");
}
function dadosDRE(ano,modo){
  const M={};const add=(k,mes,v)=>{(M[k]=M[k]||Array(12).fill(0))[mes]+=v};
  const usa=(x)=>{
    if(x.status==="cancelado")return null;
    if(x.status==="pago"){const d=x.pagoEm||x.vencimento||"";return d.slice(0,4)===String(ano)?{m:Number(d.slice(5,7))-1,v:(x.valorPago??x.valor)||0}:null}
    if(modo!=="previsto")return null;
    const d=x.vencimento||"";return d.slice(0,4)===String(ano)?{m:Number(d.slice(5,7))-1,v:x.valor||0}:null;
  };
  for(const x of S.receber){const u=usa(x);if(u)add(linhaDRE(x,"receber"),u.m,u.v)}
  for(const x of S.pagar){const u=usa(x);if(u)add(linhaDRE(x,"pagar"),u.m,u.v)}
  return M;
}
function vDRE(){
  const ano=UI.dy||new Date().getFullYear();const M=dadosDRE(ano,UI.dm);
  const z=()=>Array(12).fill(0);const soma=(...arrs)=>arrs.reduce((a,b)=>a.map((v,i)=>v+(b?b[i]:0)),z());const neg=a=>a.map(v=>-v);
  const grupo=pre=>Object.keys(M).filter(k=>k.startsWith(pre)).sort();
  const recK=grupo("rec:"),cusK=grupo("cus:"),desK=grupo("des:");
  const recB=soma(...recK.map(k=>M[k])),dev=M.dev||z(),recL=soma(recB,neg(dev));
  const cus=soma(...cusK.map(k=>M[k])),lb=soma(recL,neg(cus));
  const des=soma(...desK.map(k=>M[k])),imp=M.imp||z(),res=soma(lb,neg(des),neg(imp));
  const mesAtual=new Date().getFullYear()===ano?new Date().getMonth():11;
  const ate=UI.dm==="previsto"?11:mesAtual;
  const cols=Array.from({length:ate+1},(_,i)=>i);
  const tot=a=>cols.reduce((s,i)=>s+a[i],0);
  const cel=(v,cls="")=>`<td class="r num ${cls}${v<0?" neg":""}">${v?brl(v).replace("R$ ",""):"–"}</td>`;
  const linha=(rot,a,{cls="",sinal=1,ind=false}={})=>`<tr class="${cls}"><td class="${ind?"ind":""}">${rot}</td>${cols.map(i=>cel(a[i]*sinal)).join("")}${cel(tot(a)*sinal,"tot")}</tr>`;
  const pctL=(rot,num,den)=>`<tr class="pctrow"><td class="ind">${rot}</td>${cols.map(i=>`<td class="r num">${den[i]?pct(num[i]/den[i]):"–"}</td>`).join("")}<td class="r num tot">${tot(den)?pct(tot(num)/tot(den)):"–"}</td></tr>`;
  const anos=[...new Set([...S.receber,...S.pagar].map(x=>Number((x.pagoEm||x.vencimento||"").slice(0,4))).filter(Boolean).concat([new Date().getFullYear()]))].sort((a,b)=>b-a);
  const vazio=!recK.length&&!cusK.length&&!desK.length&&!M.imp&&!M.dev;
  const body=`<div class="tbl-wrap"><table class="dre"><thead><tr><th></th>${cols.map(i=>`<th class="r">${MES[i]}</th>`).join("")}<th class="r tot">Total</th></tr></thead><tbody>
   <tr class="sec"><td colspan="${cols.length+2}">Receitas</td></tr>
   ${recK.map(k=>linha(esc(k.slice(4)),M[k],{ind:true})).join("")||linha("Sem receitas",z(),{ind:true})}
   ${linha("Receita bruta",recB,{cls:"sub"})}
   ${linha("(−) Devoluções",dev,{ind:true,sinal:-1})}
   ${linha("Receita líquida",recL,{cls:"sub"})}
   <tr class="sec"><td colspan="${cols.length+2}">Custos dos eventos</td></tr>
   ${cusK.map(k=>linha(esc(k.slice(4)),M[k],{ind:true,sinal:-1})).join("")||linha("Sem custos",z(),{ind:true})}
   ${linha("Lucro bruto",lb,{cls:"sub"})}
   ${pctL("Margem bruta",lb,recL)}
   <tr class="sec"><td colspan="${cols.length+2}">Despesas operacionais</td></tr>
   ${desK.map(k=>linha(esc(k.slice(4)),M[k],{ind:true,sinal:-1})).join("")||linha("Sem despesas",z(),{ind:true})}
   ${linha("(−) Impostos",imp,{ind:true,sinal:-1})}
   ${linha("Resultado do período",res,{cls:"res"})}
   ${pctL("Margem líquida",res,recL)}
  </tbody></table></div>`;
  return `<div class="head"><div><h1>Resultados</h1><p class="sub">DRE ${ano} · ${UI.dm==="previsto"?"realizado + previsto (em aberto pela data de vencimento)":"realizado (o que de fato entrou e saiu)"}</p></div><div class="actions"><button class="btn" data-a="dre-csv">Exportar planilha</button></div></div>
  ${tabsRes("dre")}
  <div class="toolbar"><div class="chips"><button class="chip" data-a="dm" data-v="realizado" aria-pressed="${UI.dm!=="previsto"}">Realizado</button><button class="chip" data-a="dm" data-v="previsto" aria-pressed="${UI.dm==="previsto"}">Realizado + previsto</button></div>
   <select class="search" style="width:auto" id="dy" aria-label="Ano">${anos.map(a=>`<option value="${a}" ${a===ano?"selected":""}>${a}</option>`).join("")}</select></div>
  ${vazio?`<section class="panel"><div class="empty"><strong>Nada lançado em ${ano}</strong>O DRE se monta sozinho com os recebimentos e pagamentos registrados.</div></section>`:`<section class="panel">${body}</section>`}
  <p class="muted s" style="font-size:12px;margin:10px 2px">Custos dos eventos = despesas ligadas a um evento e as categorias Alimentos, Bebidas e Equipe/freelancers. Transferências entre contas não entram. Lançamentos sem banco também contam aqui.</p>`;
}
async function exportDRE(){

  for(const k of Object.keys(M).sort()){const s=k.startsWith("rec:")?1:-1;rows.push([nome(k),...M[k].map(v=>brlIn(v*s)),brlIn(M[k].reduce((a,b)=>a+b,0)*s)])}

function closeDlgSafe(){const d=document.getElementById("dlg");if(d&&d.open)d.close()}

/* ---------- Controle (gestão) ---------- */
const COL_N={fornecedores:"Fornecedor",clientes:"Cliente",contratos:"Contrato",receber:"A receber",orcamentos:"Orçamento",pagar:"A pagar",contas:"Banco",transf:"Transferência",equipe:"Equipe",usuarios:"Acesso",config:"Configurações"};
const mesNome=m=>m?new Date(m+"-15").toLocaleDateString("pt-BR",{month:"long",year:"numeric"}):"";
function resumoDe(col,x){
  if(!x)return "";
  switch(col){
    case "receber":return `${clienteNome(x.clienteId)||""} · ${x.descricao||""} · ${brl(x.valor)}${x.numero?" · boleto "+x.numero:""}`;
    case "pagar":return `${x.fornecedor||""} · ${x.descricao||""} · ${brl(x.valor)}`;
    case "fornecedores":return `${x.nome||""}${x.doc?" · "+x.doc:""}`;
    case "contratos":return `${x.evento||""} · ${clienteNome(x.clienteId)||""} · ${brl(x.valorTotal)}`;
    case "orcamentos":return `${x.numero||""} · ${x.evento||x.contatoNome||""}${x.valor?" · "+brl(x.valor):""}`;
    case "transf":return `Transferência · ${brl(x.valor)} · ${fmtD(x.data)}`;
    case "usuarios":return `${x.nome||""} · ${x.perfil||""}`;
    case "config":return "regras gerais";
    default:return x.nome||x.descricao||"";
  }
}
const CAMPO_N={valor:"valor",valorTotal:"valor total",vencimento:"vencimento",status:"situação",pagoEm:"pago em",valorPago:"valor pago",descricao:"descrição",fornecedor:"fornecedor",dataEvento:"data do evento",convidados:"convidados",responsavelId:"responsável",clienteId:"cliente",contaId:"banco",prioridade:"prioridade",categoria:"categoria",nome:"nome",telefone:"telefone",evento:"evento",perfil:"perfil",numero:"número",valorOriginal:"valor original",aditivos:"aditivos",fechadoAte:"fechado até",multaPct:"multa %",jurosMesPct:"juros ao mês %",comissaoPct:"comissão %",comissaoBase:"base da comissão"};
function fmtCampo(k,v){if(v==null||v==="")return "—";if(/^(valor|valorTotal|valorPago|saldoBanco|valorOriginal)$/.test(k))return brl(v);if(k==="fechadoAte")return mesNome(v);if(Array.isArray(v))return `${v.length} item(ns)`;if(/^\d{4}-\d{2}-\d{2}$/.test(String(v)))return fmtD(v);if(k==="responsavelId")return respNome(v)||v;if(k==="clienteId")return clienteNome(v)||v;if(k==="contaId")return contaNome(v)||v;if(typeof v==="object")return "(alterado)";return String(v).slice(0,60)}
function diffDe(a,b){
  if(!a||!b)return [];const out=[];
  for(const k of new Set([...Object.keys(a),...Object.keys(b)])){
    if(/^(atualizadoEm|atualizadoPor|criadoEm|criadoPor|ultimoLembrete|lembretes|anexos|em|fechamentos)$/.test(k))continue;
    const x=a[k],y=b[k];if(JSON.stringify(x)===JSON.stringify(y))continue;
    out.push({c:CAMPO_N[k]||k,de:fmtCampo(k,x),para:fmtCampo(k,y)});if(out.length>=8)break;
  }
  return out;
}
/* fechamento do mês: lançamentos pagos dentro de um mês fechado ficam travados */
function mesTravado(col,x){
  const ate=S.config.fechadoAte;if(!ate||!x)return "";
  const d=col==="transf"?x.data:(x.status==="pago"?x.pagoEm:"");
  return d&&d.slice(0,7)<=ate?d.slice(0,7):"";
}
function checarFechado(path,antes,depois){
  const col=path.split("/").slice(-2)[0];if(!["receber","pagar","transf"].includes(col))return;
  const m=mesTravado(col,antes)||mesTravado(col,depois);
  if(m){const e=new Error(`${mesNome(m)} está fechado. Para alterar lançamentos desse mês, a gestão precisa reabrir o mês em Controle.`);e.code="mes-fechado";throw e}
}
let semLixeiraN=0;
async function semLixeira(fn){semLixeiraN++;try{return await fn()}finally{semLixeiraN--}}
function gruposLixeira(){
  const L=S.lixeira.slice().sort((a,b)=>(b.em||"").localeCompare(a.em||""));const G=[];
  for(const x of L){const g=G[G.length-1];if(g&&g.por===x.por&&Math.abs(new Date(g.ult)-new Date(x.em))<20000){g.itens.push(x);g.ult=x.em}else G.push({id:x.id,por:x.por,em:x.em,ult:x.em,itens:[x]})}
  return G;
}
async function restaurarLote(gid){
  const g=gruposLixeira().find(g=>g.id===gid);if(!g)return;
  if(!await confirmBox(`Restaurar ${g.itens.length>1?g.itens.length+" itens":"este item"}?<br><span class="muted">${g.itens.map(i=>esc(COL_N[i.col]||i.col)+": "+esc(i.resumo||"")).join("<br>")}</span>`,"Restaurar"))return;
  await act(async()=>{for(const i of g.itens){await db.doc(i.path).set(i.dados);await db.collection("lixeira").doc(i.id).delete()}},`${g.itens.length} item(ns) restaurado(s)`);
}

  const meses=[];for(let i=0;i<12;i++){const d=new Date(todayISO().slice(0,7)+"-15");d.setMonth(d.getMonth()-i);meses.push(d.toISOString().slice(0,7))}

/* ---------- Relatório de conversão ---------- */
function periodo(){
  const t=todayISO(),y=t.slice(0,4),m=t.slice(0,7);
  switch(UI.op){
    case "mes":return [m+"-01",t,"Este mês"];
    case "3m":{const d=new Date();d.setMonth(d.getMonth()-2,1);return [d.getFullYear()+"-"+pad(d.getMonth()+1)+"-01",t,"Últimos 3 meses"]}
    case "ano":return [y+"-01-01",t,"Este ano"];
    case "12m":{const d=new Date();d.setMonth(d.getMonth()-11,1);return [d.getFullYear()+"-"+pad(d.getMonth()+1)+"-01",t,"Últimos 12 meses"]}
    default:return ["0000-00-00","9999-12-31","Todo o período"];
  }
}
function statsDe(arr){
  const fech=arr.filter(o=>o.status==="fechado"),perd=arr.filter(o=>o.status==="perdido"),ab=arr.filter(o=>!["fechado","perdido"].includes(o.status));
  const dec=fech.length+perd.length;
  const valF=o=>{const k=o.contratoId&&byId(S.contratos,o.contratoId);return k?(k.valorTotal||0):(o.valor||0)};
  const vF=fech.reduce((s,o)=>s+valF(o),0),vT=arr.reduce((s,o)=>s+(o.valor||0),0);
  const ciclos=fech.filter(o=>o.fechadoEm&&o.data).map(o=>dayN(o.fechadoEm)-dayN(o.data)).filter(n=>n>=0);
  return {n:arr.length,fech:fech.length,perd:perd.length,ab:ab.length,taxa:dec?fech.length/dec:null,taxaTot:arr.length?fech.length/arr.length:null,vF,vT,vAb:ab.reduce((s,o)=>s+(o.valor||0),0),ticket:fech.length?vF/fech.length:null,ciclo:ciclos.length?ciclos.reduce((a,b)=>a+b,0)/ciclos.length:null};
}
const pct=v=>v==null?"—":(v*100).toLocaleString("pt-BR",{maximumFractionDigits:0})+"%";
function grupoTabela(titulo,arr,keyFn,nomeFn){
  const g={};for(const o of arr){const k=keyFn(o)||"";(g[k]=g[k]||[]).push(o)}
  const rows=Object.entries(g).map(([k,a])=>({k,nome:nomeFn(k),s:statsDe(a)})).sort((a,b)=>b.s.vF-a.s.vF||b.s.n-a.s.n);
  if(!rows.length)return "";

document.getElementById("impIn").addEventListener("change",async ev=>{
  const file=ev.target.files&&ev.target.files[0];ev.target.value="";if(!file)return;
  let j;try{j=JSON.parse(await file.text())}catch(e){toast("Arquivo inválido: não é um backup do sistema");return}
  if(!j||!j.colecoes){toast("Arquivo inválido: não é um backup do sistema");return}
  const C=j.colecoes;const total=Object.values(C).reduce((a,b)=>a+(b||[]).length,0);
  if(!confirm(`Importar ${total} registro(s) deste backup?\n\nRegistros com o mesmo identificador serão substituídos. Faça isso uma vez só, logo após a mudança.`))return;
  const eqDeUid={};for(const v of (C.vinculos||[]))if(v.id&&v.equipeId)eqDeUid[v.id]=v.equipeId;
  const pasta=o=>o==="geral"||/^eq-/.test(o)?o:(eqDeUid[o]?"eq-"+eqDeUid[o]:"geral");
  const ops=[];const donos=new Set();
  for(const col in C){if(["vinculos","donos","usuarios"].includes(col))continue;
    for(const x of (C[col]||[])){if(!x||!x.id)continue;let path=x._c||col;
      const m=/^vendas\/([^/]+)\/([^/]+)$/.exec(path);if(m){const o=pasta(m[1]);donos.add(o);path=`vendas/${o}/${m[2]}`}
      ops.push([path+"/"+x.id,strip(x)])}}
  for(const o of donos)ops.push(["donos/"+o,{em:new Date().toISOString()}]);
  if(j.config&&Object.keys(j.config).length)ops.push(["config/geral",j.config]);
  for(const t in (j.contadores||{}))if(j.contadores[t]&&j.contadores[t].ano)ops.push(["contadores/"+t,j.contadores[t]]);
  toast("Importando… não feche a página");
  let feitos=0;
  try{
    for(let i=0;i<ops.length;i+=300){const b=db.batch();for(const [p,d] of ops.slice(i,i+300))b.set(db.doc(p),d);await comRetry(()=>b.commit());feitos=Math.min(ops.length,i+300)}
    toast(`Importação concluída: ${feitos} registro(s)`);
  }catch(e){toast(`Parou em ${feitos} de ${ops.length} (${e&&e.code||"erro"}). Pode importar de novo: nada se duplica.`)}
});

  const colDe=p=>p.split("/").slice(-2)[0];const aud=p=>Object.prototype.hasOwnProperty.call(COL_N,colDe(p))&&!p.startsWith("lixeira/")&&!p.startsWith("log/");
  const ler=async ref=>{try{const s=await ref.get();return s.exists?s.data():null}catch(e){return null}};
  const registrar=(path,acao,antes,depois)=>{const col=colDe(path);const d=depois||antes;
    _set.call(db.collection("log").doc(),{path,col,acao,por:S.me||null,em:new Date().toISOString(),resumo:resumoDe(col,d),mudancas:acao==="alterou"?diffDe(antes,depois):[]}).catch(()=>{})};
  DR.set=async function(d,opt){
    if(!aud(this.path))return _set.call(this,d,opt);
    const antes=await ler(this);const depois=opt&&opt.merge?{...(antes||{}),...d}:d;
    checarFechado(this.path,antes,depois);
    await _set.call(this,d,opt);
    if(!semLixeiraN&&!(antes&&!diffDe(antes,depois).length))registrar(this.path,antes?"alterou":"criou",antes,depois);
  };
  DR.delete=async function(){
    if(!aud(this.path))return _del.call(this);

    const d={nome,telefone:f.telefone.value.trim(),funcao:f.funcao.value.trim(),email,status:"pendente",em:new Date().toISOString()};
    f.querySelector("button").disabled=true;
    try{await ref.set(d);mostrar(d)}catch(e){document.getElementById("gateErr").textContent="Não foi possível enviar ("+(e&&e.code||"erro")+"). Tente de novo.";f.querySelector("button").disabled=false}};
}
auth.onAuthStateChanged(async u=>{
  if(!u){if(iniciado){location.reload();return}porta(MSG0);return}
  const email=(u.email||"").toLowerCase();
  if(!email||!u.emailVerified){porta(MSG0,{erro:"Essa conta Google não tem e-mail verificado.",trocar:true,botao:false});return}
  porta("Conferindo seu acesso…",{botao:false});
  let perfil=null;
  try{const s=await db.doc("usuarios/"+email).get();perfil=s.exists?s.data():null}catch(e){perfil=null}
  if(email===FIN)perfil={...(perfil||{}),perfil:"gestao",nome:(perfil&&perfil.nome)||"Financeiro"};
  if(!perfil||!["gestao","comercial"].includes(perfil.perfil)||(perfil.perfil==="comercial"&&!perfil.equipeId)){
    pedirAcesso(u,email);return}
  if(iniciado)return;iniciado=true;
  gate.hidden=true;
  S.me=email;S.perfil=perfil;S.role=perfil.perfil==="gestao"?"admin":"comercial";S.names[email]=perfil.nome||u.displayName||email;
  const who=document.getElementById("who");
  who.innerHTML=`Conectado como ${esc(u.displayName||perfil.nome||email)} · ${S.role==="admin"?"gestão":"comercial"} <button class="lnk who-out" id="sairBtn">Sair</button>`;
  document.getElementById("sairBtn").onclick=()=>auth.signOut();
  try{UI.emp=localStorage.getItem("bosco.emp")||""}catch(e){}
  S.dbState="on";render();
  const onErr=e=>{console.warn("assinatura",e&&e.code)};
  const simples=c=>db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({...d.data(),id:d.id}));S.loaded[c]=true;if(["equipe","donos"].includes(c))atualizarPastas();agendar()},onErr);
  simples("equipe");
  db.doc("config/geral").onSnapshot(s=>{S.config=s.exists?s.data():{};agendar()},onErr);
  for(const t of ["boleto","orcamento"])db.doc("contadores/"+t).onSnapshot(s=>{S.cont[t]=s.exists?s.data():{};agendar()},onErr);
  if(S.role==="admin"){
    ["pagar","extrato","contas","transf","donos","fornecedores"].forEach(simples);
    db.collection("lixeira").onSnapshot(snap=>{S.lixeira=snap.docs.map(d=>({...d.data(),id:d.id}));agendar()},onErr);
    db.collection("log").orderBy("em","desc").limit(300).onSnapshot(snap=>{S.log=snap.docs.map(d=>({...d.data(),id:d.id}));agendar()},onErr);
    db.collection("pedidos").onSnapshot(snap=>{S.pedidos=snap.docs.map(d=>({...d.data(),id:d.id}));agendar();const l=document.getElementById("eqList");if(l&&l._redraw)l._redraw()},onErr);
    db.collection("usuarios").onSnapshot(snap=>{S.usuarios=snap.docs.map(d=>({...d.data(),id:d.id}));for(const x of S.usuarios)if(x.nome)S.names[x.id]=x.nome;agendar()},onErr);
    for(const c of PRIV)db.collection(c).onSnapshot(snap=>{(PARTS[c]=PARTS[c]||{})._legado=snap.docs.map(d=>({...d.data(),id:d.id,_c:c,_o:"_legado"}));juntar(c);S.loaded[c]=true;agendar()},onErr);
    atualizarPastas();
  }else{
    assinarDono("eq-"+S.perfil.equipeId);
  }
});
})();
</script>
